[duplicate_overlap]
enabled = true
minimum_overlap_percent = 10.0
maximum_start_difference_seconds = 10000
maximum_duration_difference_percent = 100.0
require_same_type = false
# Personal exclusion: keeps this activity out of testing/dev runs against my own account.
# Not meant to carry over if this config is reused for a different athlete.
ignore_activities = ["REDACTED-ACTIVITY-ID"]

[under_time_limit]
enabled = true
maximum_duration_seconds = 100

[garmin_link_only]
enabled = true
# The exact Garmin metadata field can be adapted in checks/garmin_link_only.py.

[over_time_limit]
enabled = true
# 86400s = 24h. Flags activities longer than this as likely bad data
# (e.g. a forgotten-to-stop tracker) rather than a real workout.
maximum_duration_seconds = 86400
