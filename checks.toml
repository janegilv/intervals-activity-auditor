[duplicate_overlap]
enabled = true
minimum_overlap_percent = 10.0
maximum_start_difference_seconds = 10000
maximum_duration_difference_percent = 100.0
require_same_type = false
# Personal, account-specific exclusions (e.g. ignore_activities) live in the
# untracked checks.local.toml instead of here -- see checks.local.toml.example.

[under_time_limit]
enabled = true
maximum_duration_seconds = 100

[garmin_link_only]
enabled = true
# The exact Garmin metadata field can be adapted in intervals_auditor/checks/garmin_link_only.py.

[over_time_limit]
enabled = true
# 86400s = 24h. Flags activities longer than this as likely bad data
# (e.g. a forgotten-to-stop tracker) rather than a real workout.
maximum_duration_seconds = 86400

[implausible_pace]
enabled = true
# Speeds that don't fit the activity type: a GPS glitch, the wrong type, or
# part of the activity done in a car, bus, lift or train. Three rules, each
# with a table per activity type below. A table is used as it is: a type
# that isn't listed isn't checked by that rule (copy the whole table if you
# override it in checks.local.toml).

# Rule 1: the average speed (distance / moving time) must be within
# [lowest, highest] km/h, widened by margin_kmh -- a reading a km/h or two
# past the line is ordinary variation, not bad data.
margin_kmh = 2.0
# Rule 3: the average speed over any stretch of this many seconds must not be
# faster than sustained_speed_kmh_by_grade allows for the grade there.
sustained_seconds = 60
# Devices often settle their altitude in the first minutes; there only the
# loosest limit of the table applies.
grade_ignored_first_seconds = 300

[implausible_pace.speed_kmh_by_type]
Run = [3, 30]
TrailRun = [2, 30]
Walk = [1, 8]
Hike = [1, 8]
Ride = [3, 70]
GravelRide = [3, 65]
MountainBikeRide = [2, 55]
VirtualRide = [3, 70]
NordicSki = [2, 45]
AlpineSki = [2, 90]
OpenWaterSwim = [1, 8]
IceSkate = [2, 45]
VirtualRow = [2, 25]

# Rule 2: the top speed (km/h): the fastest 10 seconds when the activity's
# streams are fetched (so a one-sample GPS spike doesn't count -- see
# gps_glitches), otherwise the top speed the device recorded. Far above this
# on foot is a ride in a vehicle. Indoor/trainer sessions are skipped (their
# speed is virtual).
[implausible_pace.max_speed_kmh_by_type]
Walk = 20
Hike = 20
Run = 30
TrailRun = 35
Ride = 100
GravelRide = 100
MountainBikeRide = 80
EBikeRide = 100
NordicSki = 60
AlpineSki = 130
IceSkate = 50

# Rule 3: the highest plausible average speed (km/h) over sustained_seconds,
# by grade, as [grade %, km/h] points -- linear in between, flat beyond the
# ends. Downhill a bike can be as fast as a car, uphill it can't, so a car,
# bus, train or lift ride inside an activity shows up on the climbs. Needs
# the activity's streams, which are fetched from Intervals.icu for the types
# listed here (STREAMS_PER_RUN per run, or all at once with fetch-streams).
# GPS jumps and sudden altitude jumps (over 5 m/s) are left out. Where the
# grade can't be told (no altitude, or the first grade_ignored_first_seconds),
# the highest speed in the table applies.
[implausible_pace.sustained_speed_kmh_by_grade]
Ride = [[-8, 100], [-4, 80], [0, 60], [3, 42], [6, 32], [10, 24], [15, 18]]
GravelRide = [[-8, 100], [-4, 80], [0, 60], [3, 42], [6, 32], [10, 24], [15, 18]]
MountainBikeRide = [[-8, 100], [-4, 80], [0, 60], [3, 42], [6, 32], [10, 24], [15, 18]]
EBikeRide = [[-8, 100], [-4, 80], [0, 60], [3, 45], [6, 38], [10, 32], [15, 28]]
Run = [[-10, 30], [0, 26], [5, 20], [10, 16], [20, 11], [30, 8]]
TrailRun = [[-10, 30], [0, 26], [5, 20], [10, 16], [20, 11], [30, 8]]
Walk = [[-15, 22], [0, 18], [10, 12], [20, 9], [30, 7]]
Hike = [[-15, 22], [0, 18], [10, 12], [20, 9], [30, 7]]

[gps_glitches]
enabled = true
# GPS glitches: not real speed, but bad data you may want to crop. Reported
# at "info" level with where they are (h:mm:ss from the start):
# - a spike: the recorded top speed is at least spike_margin_kmh above the
#   fastest the recording holds for 10 seconds;
# - a jump: the position leaps from one point to the next (faster than
#   150 km/h).
# Needs the activity's streams, fetched from Intervals.icu for these types.
activity_types = ["Ride", "GravelRide", "MountainBikeRide", "EBikeRide", "Run", "TrailRun", "Walk", "Hike"]
spike_margin_kmh = 15

[missing_distance]
enabled = true
minimum_moving_seconds = 60
# Outdoor types expected to carry GPS distance. Indoor trainer/treadmill
# sessions of these same types (Activity.is_trainer / .is_indoor) are always
# excluded regardless of this list -- see intervals_auditor/checks/missing_distance.py.
outdoor_types = ["Ride", "GravelRide", "MountainBikeRide", "Hike", "Run", "TrailRun", "Walk", "NordicSki", "AlpineSki", "OpenWaterSwim", "IceSkate"]

[moving_elapsed_gap]
# Disabled -- the stopped-time-gap signal (large elapsed/moving divergence)
# turned out to be mostly noise in practice (long hike/ski breaks etc.), not
# a useful indicator of bad data. The negative-gap case it also covers
# (moving_time > elapsed_time, which is impossible) is a genuine data
# integrity signal though, so the check itself is left in place -- run it
# on demand with `--only moving_elapsed_gap` rather than every regular run.
enabled = false
minimum_gap_percent = 30.0
minimum_gap_seconds = 600
# A negative gap (moving_time > elapsed_time) is impossible and always
# flagged once it exceeds this tolerance; smaller ones are rounding noise.
negative_gap_tolerance_seconds = 5
