<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Intervals auditor report</title>
<style>
/*__CSS__*/
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>Intervals auditor</h1>
    <div class="meta" id="meta"></div>
    <div class="stats" id="stats"></div>
  </header>
</div>
<div id="browser"></div>

<script type="application/json" id="report-data">/*__DATA__*/</script>
<script>
/*__JS__*/
</script>
<script>
(function () {
  "use strict";
  const DATA = JSON.parse(document.getElementById("report-data").textContent);
  const UI = window.AuditorUI;
  const bits = ["Generated " + UI.when(DATA.generated_at)];
  if (DATA.last_sync) bits.push("last sync with Intervals.icu " + UI.when(DATA.last_sync));
  document.getElementById("meta").textContent = bits.join(" · ");
  UI.renderStats(document.getElementById("stats"), DATA.activities);
  try {
    // Earlier versions kept settings across tabs; forget those.
    localStorage.removeItem("intervals-auditor-report");
    sessionStorage.removeItem("intervals-auditor-report-filters");
  } catch (e) { /* ignore */ }
  UI.IssueBrowser.create(document.getElementById("browser"), {
    mode: "static",
    storageKey: "intervals-auditor-report",
    checks: DATA.checks || {},
    command: DATA.command || "python main.py",
  }).setData(DATA.activities);
})();
</script>
</body>
</html>
